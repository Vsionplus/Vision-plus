<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1565C0" />
    <title>لا يوجد اتصال بالإنترنت — Vision Plus</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Cairo', 'Segoe UI', sans-serif;
        background: #f8f9fa;
        color: #11223e;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d131f;
          color: #f1f5f9;
        }
        .card {
          background: #131c2e !important;
          border-color: #1e293b !important;
        }
        .muted {
          color: #94a3b8 !important;
        }
      }
      .card {
        width: 100%;
        max-width: 400px;
        padding: 32px 24px;
        border-radius: 20px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        box-shadow: 0 12px 32px rgba(17, 34, 62, 0.08);
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        border-radius: 16px;
        background: #1565c0;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        font-weight: 800;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.7;
        color: #475569;
      }
      button {
        width: 100%;
        min-height: 48px;
        padding: 12px 20px;
        border: none;
        border-radius: 12px;
        background: #1565c0;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.99);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        src="/icons/icon-192.png"
        alt="Vision Plus"
        width="76"
        height="76"
        style="display:block;margin:0 auto 14px;border-radius:18px;border:1px solid #e2e8f0;background:#ffffff;"
      />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p class="muted">
        يبدو أنك غير متصل بالشبكة حالياً. تأكد من اتصالك بالإنترنت ثم أعد المحاولة لتصفح منتجات Vision Plus - فيجن بلس.
      </p>
      <button type="button" onclick="window.location.reload()">
        إعادة المحاولة
      </button>
    </main>
  </body>
</html>
